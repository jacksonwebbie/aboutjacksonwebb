<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | Jackson Webb</title>
  <link rel="stylesheet" href="./style.css">
</head>

<body>
<div id="cursor-glow"></div>

<div class="page">

  <!-- HEADER: logo, info graphic, primary navigation -->
  <header class="site-header">
    <a class="logo" href="https://www.instagram.com/jacksonwebbie" target="_blank" rel="noopener">
      <img src="./jw-logo.png" alt="Jackson Webb logo, links to Instagram">
    </a>
    <div class="header-right">
      <div class="info-graphic">
        <p class="brand">Jackson Webb</p>
        <p class="tagline">Inspired by excellence · Driven by creativity, precision, and purpose</p>
      </div>
      <nav class="primary-nav" aria-label="Primary"></nav>
    </div>
  </header>

  <div class="layout">

    <!-- LEFT COLUMN: primary and secondary navigation -->
    <aside class="left-col">
      <nav class="side-nav" aria-label="Site pages"></nav>
      <nav class="secondary-nav" aria-label="On this page"></nav>
    </aside>

    <!-- MAIN CONTENT: hero image at top, then text and images -->
    <main class="main-col">
      <section class="hero">
        <div class="hero-text">
          <h1>Contact Me</h1>
          <p>Questions, bookings, lessons, or feedback on the site.</p>
        </div>
      </section>

      <div class="content">
        <h2>Send Me a Message</h2>
        <p>Fill out the form below and I'll get back to you.</p>

        <div class="form-wrap">
          <!-- Google Form embed: replace the src with your form's embed link
               (Google Forms > Send > the < > tab > copy the src="..." part) -->
          <iframe
            src="PASTE_GOOGLE_FORM_EMBED_LINK_HERE"
            title="Contact form"
            loading="lazy">Loading…</iframe>
        </div>
      </div>
    </main>

    <!-- RIGHT COLUMN: sticky content (news, offers, site info, social) -->
    <aside class="right-col" aria-label="News and info"></aside>

  </div>

  <!-- FOOTER: copyright, year, links, contact, privacy, webmaster -->
  <footer class="site-footer"></footer>

</div>

<script src="./navigation.js"></script>
</body>
</html>
